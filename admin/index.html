<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Bland Masonry</title>
  
  <style>
    /* Force Decap CMS thumbnail containers and preview images to scale cleanly */
    div[class^="image-wrapper"], 
    div[class*="image-wrapper"],
    span[class^="image-wrapper"],
    span[class*="image-wrapper"],
    img[src^="blob:"],
    img[alt*="image"] {
      max-height: 250px !important;
      object-fit: contain !important;
      background-color: #1a1a1a !important;
    }

    /* Target the list widget thumbnail view specifically */
    ul [class*="image-wrapper"] img,
    div[data-slate-editor] img {
      width: 100% !important;
      height: auto !important;
      object-fit: contain !important;
    }
  </style>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
