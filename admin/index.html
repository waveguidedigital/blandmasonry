<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Bland Masonry</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Create a custom React component using Decap's built-in 'h' function
    const GalleryPreview = createClass({
      render: function() {
        // Fetch the list of photos from the left-hand editor
        const photos = this.props.entry.getIn(['data', 'photos']);
        
        if (!photos || photos.size === 0) {
          return h('div', {style: { padding: '20px', color: '#666' }}, "Upload photos on the left to see them here.");
        }

        // Map over the photos and output a grid of square thumbnails
        const imageElements = photos.map((photo, index) => {
          const imageUrl = photo.get('image');
          if (!imageUrl) return null;

          return h('div', { key: index, style: { overflow: 'hidden', borderRadius: '8px', backgroundColor: '#eee' } },
            h('img', {
              // getAsset ensures the image loads even if it hasn't been pushed to GitHub yet
              src: this.props.getAsset(imageUrl).toString(),
              style: { width: '100%', height: '150px', objectFit: 'cover', display: 'block' }
            })
          );
        });

        // Return the grid container
        return h('div', {
          style: {
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))',
            gap: '15px',
            padding: '20px'
          }
        }, imageElements);
      }
    });

    // Tell Decap to use this template for the 'photos_list' file configuration
    CMS.registerPreviewTemplate("photos_list", GalleryPreview);
  </script>
  
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
